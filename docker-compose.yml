# Entorno de desarrollo local.
#
# Se eliminó el servicio `openvas`: ningún código se conectaba a él. El escáner
# usa sockets de Python y no depende de binarios externos.

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardia-postgres
    environment:
      POSTGRES_DB: guardia_gt
      POSTGRES_USER: guardia
      POSTGRES_PASSWORD: guardia123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardia -d guardia_gt"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: guardia-backend
    ports:
      - "8000:8000"
    environment:
      # El host `postgres` está en la lista de hosts locales, así que la aplicación
      # no fuerza TLS: este contenedor de Postgres viene con SSL desactivado y la
      # conexión fallaba con "server does not support SSL".
      DATABASE_URL: postgresql://guardia:guardia123@postgres:5432/guardia_gt
      SECRET_KEY: clave-solo-para-desarrollo-local
      CORS_ORIGINS: '["http://localhost:5173"]'
      SEED_TOKEN: seed-local
      # En local sí tiene sentido escanear la red interna del cliente.
      SCAN_ALLOW_PRIVATE_TARGETS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: guardia-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
