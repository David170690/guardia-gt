services:
  - type: web
    name: guardia-gt-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guardia-gt-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:3000","https://guardia-gt-frontend.onrender.com","https://guardia-gt-backend.onrender.com"]'
    rootDir: backend
    healthCheckPath: /health

  - type: web
    name: guardia-gt-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --port $PORT
    envVars:
      - key: VITE_API_URL
        fromService:
          name: guardia-gt-backend
          property: host
    rootDir: frontend

  - type: postgres
    name: guardia-gt-db
    database: guardia_gt
    plan: free
    ipAllowList: []
